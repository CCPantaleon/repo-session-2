<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="architecture-title architecture-desc"><title id="architecture-title">From selection to verified copies</title><desc id="architecture-desc">The app plans and coordinates transfers, verifies destination readback, rereads source content, publishes per destination and writes reports.</desc>
<defs><marker id="architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7866a5"/></marker></defs>
<rect width="1000" height="360" rx="20" fill="#f8f7fb"/>
<text x="38" y="49" fill="#211b30" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="22" font-weight="700">From selection to verified copies</text>
<path d="M165 162 L185 162" fill="none" stroke="#7866a5" stroke-width="2" marker-end="url(#architecture-arrow)"/>
<path d="M325 162 L345 162" fill="none" stroke="#7866a5" stroke-width="2" marker-end="url(#architecture-arrow)"/>
<path d="M485 162 L505 162" fill="none" stroke="#7866a5" stroke-width="2" marker-end="url(#architecture-arrow)"/>
<path d="M645 162 L665 162" fill="none" stroke="#7866a5" stroke-width="2" marker-end="url(#architecture-arrow)"/>
<path d="M805 162 L825 162" fill="none" stroke="#7866a5" stroke-width="2" marker-end="url(#architecture-arrow)"/>
<path d="M575 215 L575 260" fill="none" stroke="#7866a5" stroke-width="2" marker-end="url(#architecture-arrow)"/>
<rect x="25" y="110" width="140" height="105" rx="12" fill="white" stroke="#d9d3e6"/>
<text x="41" y="138" fill="#4e357f" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700">1  Plan</text>
<text x="41" y="161" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Sources, targets,</text>
<text x="41" y="180" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">layout, options</text>
<rect x="185" y="110" width="140" height="105" rx="12" fill="white" stroke="#d9d3e6"/>
<text x="201" y="138" fill="#4e357f" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700">2  Coordinate</text>
<text x="201" y="161" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Safety checks;</text>
<text x="201" y="180" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">queue, scheduling</text>
<rect x="345" y="110" width="140" height="105" rx="12" fill="white" stroke="#d9d3e6"/>
<text x="361" y="138" fill="#4e357f" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700">3  Transfer</text>
<text x="361" y="161" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Hash source; write</text>
<text x="361" y="180" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">staged copies</text>
<rect x="505" y="110" width="140" height="105" rx="12" fill="white" stroke="#d9d3e6"/>
<text x="521" y="138" fill="#4e357f" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700">4  Read back</text>
<text x="521" y="161" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Verify each</text>
<text x="521" y="180" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">destination</text>
<rect x="665" y="110" width="140" height="105" rx="12" fill="white" stroke="#d9d3e6"/>
<text x="681" y="138" fill="#4e357f" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700">5  Recheck</text>
<text x="681" y="161" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Reread source</text>
<text x="681" y="180" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">for integrity</text>
<rect x="825" y="110" width="150" height="105" rx="12" fill="white" stroke="#d9d3e6"/>
<text x="841" y="138" fill="#4e357f" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700">6  Publish</text>
<text x="841" y="161" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Per destination;</text>
<text x="841" y="180" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">write receipts</text>
<rect x="245" y="260" width="570" height="65" rx="12" fill="white" stroke="#d9d3e6"/>
<text x="261" y="288" fill="#4e357f" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700">Recovery</text>
<text x="261" y="311" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Persistent job state and validated resume; failures remain visible</text>
</svg>