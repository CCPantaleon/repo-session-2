<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="file-lifecycle-title file-lifecycle-desc"><title id="file-lifecycle-title">A file’s path to publication</title><desc id="file-lifecycle-desc">Source data is read and hashed while destination staging files are written. The source hash is frozen, destinations are read back, and the source is reread before publication.</desc>
<defs><marker id="file-lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7866a5"/></marker></defs>
<rect width="1000" height="360" rx="20" fill="#f8f7fb"/>
<text x="38" y="49" fill="#211b30" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="22" font-weight="700">A file’s path to publication</text>
<path d="M195 162 L215 162" fill="none" stroke="#7866a5" stroke-width="2" marker-end="url(#file-lifecycle-arrow)"/>
<path d="M380 162 L400 162" fill="none" stroke="#7866a5" stroke-width="2" marker-end="url(#file-lifecycle-arrow)"/>
<path d="M570 162 L590 162" fill="none" stroke="#7866a5" stroke-width="2" marker-end="url(#file-lifecycle-arrow)"/>
<path d="M760 162 L780 162" fill="none" stroke="#7866a5" stroke-width="2" marker-end="url(#file-lifecycle-arrow)"/>
<path d="M500 215 L500 260" fill="none" stroke="#7866a5" stroke-width="2" marker-end="url(#file-lifecycle-arrow)"/>
<rect x="20" y="110" width="175" height="105" rx="12" fill="white" stroke="#d9d3e6"/>
<text x="36" y="138" fill="#4e357f" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700">1  Stream</text>
<text x="36" y="161" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Read and hash source;</text>
<text x="36" y="180" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">write staged copies</text>
<rect x="215" y="110" width="165" height="105" rx="12" fill="white" stroke="#d9d3e6"/>
<text x="231" y="138" fill="#4e357f" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700">2  Freeze</text>
<text x="231" y="161" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Save source SHA-256</text>
<text x="231" y="180" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">reference</text>
<rect x="400" y="110" width="170" height="105" rx="12" fill="white" stroke="#d9d3e6"/>
<text x="416" y="138" fill="#4e357f" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700">3  Read back</text>
<text x="416" y="161" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Independently verify</text>
<text x="416" y="180" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">each destination</text>
<rect x="590" y="110" width="170" height="105" rx="12" fill="white" stroke="#d9d3e6"/>
<text x="606" y="138" fill="#4e357f" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700">4  Reread</text>
<text x="606" y="161" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Check source content</text>
<text x="606" y="180" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">against reference</text>
<rect x="780" y="110" width="195" height="105" rx="12" fill="white" stroke="#d9d3e6"/>
<text x="796" y="138" fill="#4e357f" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700">5  Publish</text>
<text x="796" y="161" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Protect conflicts;</text>
<text x="796" y="180" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">retain verified copy</text>
<rect x="220" y="260" width="555" height="65" rx="12" fill="white" stroke="#d9d3e6"/>
<text x="236" y="288" fill="#4e357f" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700">Resume</text>
<text x="236" y="311" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Rehash existing files and validate partial prefixes before continuing</text>
</svg>