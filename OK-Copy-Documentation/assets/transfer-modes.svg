<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="transfer-modes-title transfer-modes-desc"><title id="transfer-modes-title">Direct and cascading paths</title><desc id="transfer-modes-desc">Direct mode sends source chunks to destination writers. In cascading mode the first destination is verified, then checked again before it supplies backups.</desc>
<defs><marker id="transfer-modes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7866a5"/></marker></defs>
<rect width="1000" height="360" rx="20" fill="#f8f7fb"/>
<text x="38" y="49" fill="#211b30" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="22" font-weight="700">Direct and cascading paths</text>
<path d="M200 122 L365 122" fill="none" stroke="#7866a5" stroke-width="2" marker-end="url(#transfer-modes-arrow)"/>
<path d="M545 122 L750 122" fill="none" stroke="#7866a5" stroke-width="2" marker-end="url(#transfer-modes-arrow)"/>
<path d="M200 257 L285 257" fill="none" stroke="#7866a5" stroke-width="2" marker-end="url(#transfer-modes-arrow)"/>
<path d="M485 257 L575 257" fill="none" stroke="#7866a5" stroke-width="2" marker-end="url(#transfer-modes-arrow)"/>
<path d="M740 257 L810 257" fill="none" stroke="#7866a5" stroke-width="2" marker-end="url(#transfer-modes-arrow)"/>
<rect x="35" y="85" width="165" height="75" rx="12" fill="white" stroke="#d9d3e6"/>
<text x="51" y="113" fill="#4e357f" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700">DIRECT</text>
<text x="51" y="136" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Original source</text>
<rect x="365" y="85" width="180" height="75" rx="12" fill="white" stroke="#d9d3e6"/>
<text x="381" y="113" fill="#4e357f" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700">Fan-out</text>
<text x="381" y="136" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Bounded writer queues</text>
<rect x="750" y="72" width="200" height="95" rx="12" fill="white" stroke="#d9d3e6"/>
<text x="766" y="100" fill="#4e357f" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700">Destinations</text>
<text x="766" y="123" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Read back and verify</text>
<text x="766" y="142" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">each copy</text>
<rect x="35" y="220" width="165" height="75" rx="12" fill="white" stroke="#d9d3e6"/>
<text x="51" y="248" fill="#4e357f" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700">CASCADE</text>
<text x="51" y="271" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Original source</text>
<rect x="285" y="220" width="200" height="75" rx="12" fill="white" stroke="#d9d3e6"/>
<text x="301" y="248" fill="#4e357f" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700">Working copy</text>
<text x="301" y="271" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Destination 1 verified</text>
<rect x="575" y="220" width="165" height="75" rx="12" fill="white" stroke="#d9d3e6"/>
<text x="591" y="248" fill="#4e357f" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700">Recheck</text>
<text x="591" y="271" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Identity, inventory</text>
<text x="591" y="290" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">and hashes</text>
<rect x="810" y="220" width="155" height="75" rx="12" fill="white" stroke="#d9d3e6"/>
<text x="826" y="248" fill="#4e357f" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700">Backups</text>
<text x="826" y="271" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Read from working</text>
<text x="826" y="290" fill="#403a4b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">copy; verify</text>
</svg>